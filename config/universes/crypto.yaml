# 加密货币 · 市值前 220（动态 universe：由 CoinGecko 决定成分）
#
# 模型定义见 src/stockbubble/domain/models.py::Universe
# 规则提醒：sectors 的键 = 大写 symbol；exclude 的取值 = 大写 symbol。
id: crypto
name: 加密货币 · 主流
asset_class: crypto
provider: coingecko
currency: USD
default_window: 24h
supported_windows: [1h, 24h, 7d, 30d]
limit: 220
# 榜外的新币（每天都有）没有手写分类时落到这个板块，避免出现「未分类」
fallback_sector: 其他

# 稳定币、代币化国债与包装/质押凭证几乎没有价格波动，却会吃掉气泡面积，直接排除
